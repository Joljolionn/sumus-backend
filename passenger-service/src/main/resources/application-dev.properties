spring.application.name=passenger-service

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.mongodb.uri=mongodb://mongodb-sumus:27017/sumus_db

# TODO: Definir 'secret' ao fazer deploy da aplicação
api.security.token.secret=${JWT_SECRET:maria-do-carmo} 

# springdoc.swagger-ui.enabled=false

server.servlet.context-path=/passenger

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://auth-service:8080
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://auth-service:8080/auth/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.authorities-claim-name=role_type
spring.security.oauth2.resourceserver.jwt.authority-prefix=
