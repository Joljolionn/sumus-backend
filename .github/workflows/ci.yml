name: QA Pipeline

on:
  pull_request:
    branches: [main]

jobs:
  build-and-analyze:
    name: Build, Test & Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Starting MongoDB for Testing
        run: docker compose --profile db up -d

      - name: Build, Test & Sonar (Driver Service)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd driver-service
          mvn clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=joljolionn_sumus_driver-service \
          -Dsonar.organization=joljolionn \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.qualitygate.wait=false

      - name: Build, Test & Sonar (Passenger Service)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd passenger-service
          mvn clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=joljolionn_sumus_passenger-service \
          -Dsonar.organization=joljolionn \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.qualitygate.wait=false

      - name: Stop containers
        if: always()
        run: docker compose --profile db down
