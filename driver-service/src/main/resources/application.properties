spring.application.name=driver-service

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.mongodb.uri=mongodb://localhost:27018/sumus_db

# springdoc.swagger-ui.enabled=false

server.servlet.context-path=/driver

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://auth-service:8080
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://auth-service:8080/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.authorities-claim-name=role_type
spring.security.oauth2.resourceserver.jwt.authority-prefix=
